<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vdi-cloud-grad" x1="32" y1="8" x2="32" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <mask id="vdi-moat">
      <rect width="64" height="64" fill="#ffffff"/>
      <rect x="11.2" y="21.2" width="41.6" height="32.6" rx="6.8" fill="#000000"/>
    </mask>
  </defs>
  <!-- Three-lobe geometric cloud canopy with 3.8u negative-space knockout moat -->
  <path
    d="M16 38h32a10 10 0 0 0 1.4-19.9A13.5 13.5 0 0 0 23.2 14a11 11 0 0 0-10.7 8.4A9 9 0 0 0 16 38Z"
    fill="url(#vdi-cloud-grad)"
    mask="url(#vdi-moat)"
  />
  <!-- Floating VDI viewport window -->
  <rect x="15" y="25" width="34" height="25" rx="4" fill="#0b1120" stroke="#3b82f6" stroke-width="2"/>
  <!-- Top window bar accent -->
  <line x1="15" y1="31" x2="49" y2="31" stroke="#1f2937" stroke-width="1.5"/>
  <!-- Ready status node -->
  <circle cx="44" cy="28" r="1.75" fill="#10b981"/>
  <!-- Terminal chevron (>) + emerald underscore (_) -->
  <path d="M22 37l4.5 3.5L22 44" stroke="#f3f4f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="29.5" y1="44" x2="37" y2="44" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
</svg>
