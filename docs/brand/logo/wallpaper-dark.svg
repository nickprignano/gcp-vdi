  <!-- Right-side subtle ambient glow -->
  <rect width="2560" height="1440" fill="url(#glow-dark)"/>
  <!-- Centered-right brand mark (leaves left desktop icon zone clean) -->
  <g transform="translate(1780, 620) scale(3.2)" opacity="0.85">
    <path
