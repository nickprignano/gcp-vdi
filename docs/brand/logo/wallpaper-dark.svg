      <rect x="11.2" y="21.2" width="41.6" height="32.6" rx="6.8" fill="#000000"/>
    </mask>
  </defs>
  <!-- Canvas -->
  <rect width="2560" height="1440" fill="#0b1120"/>
  <!-- Subtle technical grid (kept low-contrast on left icon zone) -->
