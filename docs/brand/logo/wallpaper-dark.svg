<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" fill="none">
  <defs>
    <pattern id="grid-dark" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#1f2937" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
    <radialGradient id="glow-dark" cx="72%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#111827" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vdi-cloud-wp-d" x1="32" y1="8" x2="32" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
