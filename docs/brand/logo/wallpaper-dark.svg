    <line x1="15" y1="31" x2="49" y2="31" stroke="#1f2937" stroke-width="1.5"/>
    <circle cx="44" cy="28" r="1.75" fill="#10b981"/>
    <path d="M22 37l4.5 3.5L22 44" stroke="#f3f4f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
